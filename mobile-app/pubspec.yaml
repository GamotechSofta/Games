name: games_mobile
description: Games mobile app with click-to-call (WebRTC + Socket.IO)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^0.12.4
  shared_preferences: ^2.3.3
  http: ^1.2.2
  flutter_background_service: ^5.0.12
  flutter_background_service_android: ^6.2.7
  flutter_callkit_incoming: ^2.5.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
