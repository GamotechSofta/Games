# Render Blueprint — aakda.in must be a Web Service (not Static Site)
# so /operator and /service can reverse-proxy to the API.
#
# PotLudo calls https://aakda.in/operator/* — static CDN returns empty 200
# and PotLudo fails: "Operator gateway request failed with status 200."
services:
  - type: web
    name: aakda-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPERATOR_PROXY_TARGET
        value: https://api.aakda.in
