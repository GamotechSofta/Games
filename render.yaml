# Render Blueprint — frontend static site + PotLudo operator proxy
# Docs: https://render.com/docs/redirects-rewrites
#
# Critical: PotLudo calls https://aakda.in/operator/* and /service/*
# Those must REWRITE (proxy) to the API host, or session returns empty HTTP 200
# and PotLudo fails with: "Operator gateway request failed with status 200."
services:
  - type: web
    name: aakda-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /operator/*
        destination: https://api.aakda.in/operator/*
      - type: rewrite
        source: /service/*
        destination: https://api.aakda.in/service/*
      - type: rewrite
        source: /*
        destination: /index.html
