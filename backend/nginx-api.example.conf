# Example nginx config for api.aakda.in (AWS EC2)
# Place in /etc/nginx/sites-available/api.aakda.in and symlink to sites-enabled.
# Node/PM2 listens on PORT 4000 (see ecosystem.config.cjs).

upstream games_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.aakda.in;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 2m;

    # REST API
    location /api/ {
        proxy_pass http://games_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not cache live market data at nginx
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.IO — required for instant wallet/call (markets also use SSE fallback)
    location /socket.io/ {
        proxy_pass http://games_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SSE live market updates — disable buffering (critical)
    location /api/v1/markets/live-updates {
        proxy_pass http://games_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    location /health {
        proxy_pass http://games_backend;
    }
}
