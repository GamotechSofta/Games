# Nginx production performance profile

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/rss+xml
  image/svg+xml
  font/ttf
  font/otf
  application/vnd.ms-fontobject;

# Enable only when nginx has brotli module
brotli on;
brotli_comp_level 5;
brotli_static on;
brotli_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  image/svg+xml;

server {
  listen 80;
  server_name _;
  root /var/www/frontend/dist;
  index index.html;

  # Immutable cache for Vite hashed assets
  location ~* ^/assets/.*\.[a-f0-9]{8,}\.(js|css|mjs|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Cache optimized static media
  location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  # API caching hints (reverse proxy backend)
  location /api/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

